<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <!-- Canvas Confetti Library for celebration effects -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7dcd9;
      overflow: hidden;
    }
    .wrapper {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      position: relative;
      transition: transform 0.3s ease;
    }
    .gif-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    .gif {
      max-width: 100%;
      max-height: 220px;
      border-radius: 15px;
      object-fit: contain;
    }
    .question {
      font-size: 24px;
      color: #333333;
      margin: 20px 0;
      font-weight: bold;
      line-height: 1.3;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      min-height: 60px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      font-weight: bold;
      outline: none;
      user-select: none;
    }
    .btn:active {
      transform: scale(0.95);
    }
    #yesButton {
      background-color: #f06292;
      color: white;
      box-shadow: 0 4px 10px rgba(240, 98, 146, 0.4);
      z-index: 10;
    }
    #yesButton:hover {
      background-color: #ec407a;
    }
    #noButton {
      background-color: #e0e0e0;
      color: #333333;
    }
    #noButton:hover {
      background-color: #d6d6d6;
    }

    /* Floating hearts background animation */
    .heart {
      position: absolute;
      color: #f06292;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Card Wrapper -->
  <div class="wrapper" id="cardWrapper">
    <!-- Animated GIF / Illustration -->
    <div class="gif-container">
      <img 
        id="valentineGif" 
        class="gif" 
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDdtZ2JiZDR0a3lvMWF4OG83cnB3MjVxZ3FkZzZsZzh4eXF4M2V6eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/cLS1YxsMxbP2w/giphy.gif" 
        alt="Cute begging cat"
        onerror="this.onerror=null; this.src='https://placehold.co/300x200/f06292/ffffff?text=Be+My+Valentine!';"
      />
    </div>

    <!-- Dynamic Heading -->
    <h1 class="question" id="questionText">Will you be my Valentine? 💕</h1>

    <!-- Button Options -->
    <div class="btn-group" id="btnGroup">
      <button class="btn" id="yesButton">Yes</button>
      <button class="btn" id="noButton">No</button>
    </div>
  </div>

  <script>
    // Escalating messages when clicking 'No'
    const noPhrases = [
      "No",
      "Are you sure? 🥺",
      "Think again! 💭",
      "Pleaaseee? 🙏",
      "Don't do this to me! 💔",
      "You're breaking my heart! 😿",
      "I'll buy you chocolate! 🍫",
      "Pretty please? ✨",
      "Give it another thought! 🧐",
      "Surely you don't mean that! 🌹",
      "Just press YES! ❤️"
    ];

    let noCount = 0;
    let yesScale = 1;
    let paddingSize = 10;
    let fontSize = 16;

    const yesBtn = document.getElementById('yesButton');
    const noBtn = document.getElementById('noButton');
    const questionText = document.getElementById('questionText');
    const valentineGif = document.getElementById('valentineGif');
    const btnGroup = document.getElementById('btnGroup');

    // Create ambient floating hearts background
    function createBackgroundHearts() {
      const heartSymbols = ['💖', '💕', '🌸', '✨', '❤️'];
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        document.body.appendChild(heart);
      }
    }

    createBackgroundHearts();

    // Event Listener for "No" Button
    noBtn.addEventListener('click', () => {
      noCount++;
      
      // Update No Button text dynamically
      const phraseIndex = Math.min(noCount, noPhrases.length - 1);
      noBtn.innerText = noPhrases[phraseIndex];

      // Progressively grow the "Yes" button
      yesScale += 0.35;
      paddingSize += 4;
      fontSize += 3;

      yesBtn.style.transform = `scale(${yesScale})`;
      yesBtn.style.padding = `${paddingSize}px ${paddingSize * 2}px`;
      yesBtn.style.fontSize = `${fontSize}px`;

      // Slightly add subtle dodge effect if pressed many times
      if (noCount > 5) {
        const randomX = (Math.random() - 0.5) * 40;
        const randomY = (Math.random() - 0.5) * 40;
        noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
      }
    });

    // Event Listener for "Yes" Button
    yesBtn.addEventListener('click', () => {
      // Trigger Happy Success Screen
      valentineGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2ZlZzN4M3N0NDFqODR0ZWJkZzZsZzh4eXF4M2V6eCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif"; // Happy dancing cat
      questionText.innerHTML = "Yay! I knew you'd say yes! 🎉💕";

      // Hide the buttons after selection
      btnGroup.style.display = "none";

      // Trigger Confetti Celebration
      if (typeof confetti === 'function') {
        const duration = 3 * 1000;
        const animationEnd = Date.now() + duration;

        (function frame() {
          confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: ['#f06292', '#ff80ab', '#ff4081', '#ffffff']
          });
          confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: ['#f06292', '#ff80ab', '#ff4081', '#ffffff']
          });

          if (Date.now() < animationEnd) {
            requestAnimationFrame(frame);
          }
        })();
      }
    });
  </script>
</body>
</html>
